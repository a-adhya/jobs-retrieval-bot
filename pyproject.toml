[project]
name = "jobbot"
version = "0.1.0"
description = "Weekly job and company-prospect digest matched to one person's resume and preferences."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiolimiter>=1.1",
    "alembic>=1.13",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "tenacity>=8.5",
    "typer>=0.12",
]

[project.scripts]
jobs = "jobbot.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
