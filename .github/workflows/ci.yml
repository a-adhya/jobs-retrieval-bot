name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobbot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      JOBBOT_ENV: test
      JOBBOT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobbot_ci
      JOBBOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobbot_test
      JOBBOT_ALLOWED_EMAILS: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Migrations apply, reverse and re-apply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
